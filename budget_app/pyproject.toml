[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget_app"
version = "1.0.0"
description = "The budget manager written in Python"
requires-python = ">=3.14.7"
dependencies = [
    "mssql-python>=1.14.0",
    "python-dotenv>=1.2.3"
]

[project.scripts]
budget = "budget.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1"
]

[tool.pytest.ini_options]
testpaths = ["test"]